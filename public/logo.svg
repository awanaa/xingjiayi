<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <!-- Premium gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#BF953F"/>
      <stop offset="25%"  stop-color="#FCF6B5"/>
      <stop offset="50%"  stop-color="#B38728"/>
      <stop offset="75%"  stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    
    <!-- Gold shine overlay -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FCF6B5" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#BF953F" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#AA771C" stop-opacity="0.4"/>
    </linearGradient>
    
    <!-- Soft glow for gold on dark bg -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow behind icon -->
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#BF953F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ====== ICON: Minimalist Origami Diamond ====== -->
  <!-- The diamond uses negative space + 3D fold illusion to represent paper art & precision -->
  <g transform="translate(20, 20)" filter="url(#iconShadow)">
    <!-- Base diamond outline -->
    <polygon points="48,0 96,48 48,96 0,48" 
             fill="none" stroke="url(#gold)" stroke-width="3"/>
    
    <!-- Fold surfaces: 4 triangles creating 3D depth -->
    <!-- Top facet (lightest - catching light) -->
    <polygon points="48,0 96,48 48,48" fill="url(#goldShine)" opacity="0.7"/>
    <!-- Right facet -->
    <polygon points="96,48 48,96 48,48" fill="url(#gold)" opacity="0.45"/>
    <!-- Bottom facet (darkest - shadow) -->
    <polygon points="48,96 0,48 48,48" fill="url(#gold)" opacity="0.2"/>
    <!-- Left facet -->
    <polygon points="0,48 48,0 48,48" fill="url(#goldShine)" opacity="0.15"/>

    <!-- Central cross fold lines -->
    <line x1="48" y1="0" x2="48" y2="96" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="48" x2="96" y2="48" stroke="url(#gold)" stroke-width="0.8" opacity="0.3"/>

    <!-- Core accent: small diamond in center representing "precision" -->
    <polygon points="48,36 60,48 48,60 36,48" fill="#141414" stroke="url(#gold)" stroke-width="1.5"/>
    <polygon points="48,39 57,48 48,57 39,48" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- ====== TYPOGRAPHY ====== -->
  
  <!-- Chinese company name -->
  <text x="145" y="56" 
        font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" 
        font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="8">
    星嘉艺
  </text>

  <!-- English brand name (narrower spacing, more premium feel) -->
  <text x="145" y="86" 
        font-family="'Inter','Helvetica Neue','SF Pro Display',Arial,sans-serif" 
        font-size="13" font-weight="600" fill="url(#gold)" letter-spacing="5.5">
    XINGJIAYI
  </text>

  <!-- Decorative divider -->
  <line x1="145" y1="98" x2="282" y2="98" 
        stroke="url(#gold)" stroke-width="0.8" opacity="0.4"/>

  <!-- Tagline -->
  <text x="145" y="114" 
        font-family="'Inter','Helvetica Neue','SF Pro Text',Arial,sans-serif" 
        font-size="10" font-weight="300" fill="#999999" letter-spacing="3.5">
    PAPER ART · PRECISION PRINT
  </text>
</svg>
